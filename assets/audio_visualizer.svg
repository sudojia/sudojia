<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 64" width="100%" height="100%">
  <defs>
    <linearGradient id="eqGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <style>
      @keyframes eq1 { 0%, 100% { height: 8px; y: 28px; } 50% { height: 32px; y: 16px; } }
      @keyframes eq2 { 0%, 100% { height: 26px; y: 19px; } 50% { height: 10px; y: 27px; } }
      @keyframes eq3 { 0%, 100% { height: 14px; y: 25px; } 50% { height: 36px; y: 14px; } }
      @keyframes eq4 { 0%, 100% { height: 32px; y: 16px; } 50% { height: 16px; y: 24px; } }
      @keyframes eq5 { 0%, 100% { height: 18px; y: 23px; } 50% { height: 30px; y: 17px; } }
      .bar-1 { animation: eq1 1.1s ease-in-out infinite; }
      .bar-2 { animation: eq2 0.9s ease-in-out infinite; }
      .bar-3 { animation: eq3 1.3s ease-in-out infinite; }
      .bar-4 { animation: eq4 0.8s ease-in-out infinite; }
      .bar-5 { animation: eq5 1.2s ease-in-out infinite; }
      .bar-6 { animation: eq2 1.4s ease-in-out infinite; }
      .bar-7 { animation: eq4 1.0s ease-in-out infinite; }
      .bar-8 { animation: eq1 1.25s ease-in-out infinite; }
    </style>
  </defs>

  <!-- 背景底槽 -->
  <rect width="850" height="64" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <!-- 左侧光盘/音乐图标 -->
  <g transform="translate(24, 18)">
    <circle cx="14" cy="14" r="14" fill="#161b22" stroke="#00F5D4" stroke-width="1.5" />
    <circle cx="14" cy="14" r="5" fill="#7B2CBF" />
    <circle cx="14" cy="14" r="2" fill="#FF007F" />
  </g>

  <!-- 歌曲信息 -->
  <g transform="translate(68, 26)">
    <text x="0" y="0" fill="#f0f6fc" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="bold">
      🎧 NOW PLAYING: <tspan fill="#00F5D4">Cyberpunk Lo-Fi Chill Beats</tspan>
    </text>
    <text x="0" y="19" fill="#8b949e" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      sudojia's Coding Space · 沉浸式写代码与自动化运维日常 ✨
    </text>
  </g>

  <!-- 右侧动态跳动音量柱 -->
  <g transform="translate(730, 0)">
    <rect x="0" y="24" width="4" height="16" rx="2" fill="url(#eqGrad)" class="bar-1" />
    <rect x="9" y="19" width="4" height="26" rx="2" fill="url(#eqGrad)" class="bar-2" />
    <rect x="18" y="25" width="4" height="14" rx="2" fill="url(#eqGrad)" class="bar-3" />
    <rect x="27" y="16" width="4" height="32" rx="2" fill="url(#eqGrad)" class="bar-4" />
    <rect x="36" y="23" width="4" height="18" rx="2" fill="url(#eqGrad)" class="bar-5" />
    <rect x="45" y="19" width="4" height="26" rx="2" fill="url(#eqGrad)" class="bar-6" />
    <rect x="54" y="16" width="4" height="32" rx="2" fill="url(#eqGrad)" class="bar-7" />
    <rect x="63" y="24" width="4" height="16" rx="2" fill="url(#eqGrad)" class="bar-8" />
  </g>
</svg>
