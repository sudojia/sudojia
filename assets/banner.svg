<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- 赛博流光渐变 -->
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="30%" stop-color="#00BBF9" />
      <stop offset="70%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>

    <!-- 文本发光渐变 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- 徽标渐变 -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- 动态网格背景图案 -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 212, 0.07)" stroke-width="1" />
    </pattern>

    <style>
      @keyframes borderPulse {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(0, 245, 212, 0.4)); }
        50% { filter: drop-shadow(0 0 16px rgba(123, 44, 191, 0.6)); }
      }
      @keyframes laserMove {
        0% { transform: translateX(-100px); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateX(950px); opacity: 0; }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .glow-box { animation: borderPulse 4s ease-in-out infinite; }
      .laser { animation: laserMove 6s linear infinite; }
      .beacon { animation: beaconBlink 1.5s infinite; }
    </style>
  </defs>

  <!-- 外层卡片底座 (深邃赛博夜空) -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="#090d16" stroke="url(#cyberNeon)" stroke-width="2.5" class="glow-box" />

  <!-- 科技网格纹理 -->
  <rect x="3" y="3" width="894" height="234" rx="15" fill="url(#gridPattern)" />

  <!-- 顶部科技感流光激光线 -->
  <line x1="0" y1="2" x2="120" y2="2" stroke="#00F5D4" stroke-width="3" class="laser" stroke-linecap="round" />

  <!-- 左上角状态信息指示灯 -->
  <g transform="translate(30, 28)">
    <circle cx="6" cy="6" r="4.5" fill="#10b981" class="beacon" />
    <circle cx="6" cy="6" r="8" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5" />
    <text x="20" y="10" fill="#34d399" font-size="11" font-family="monospace" font-weight="bold" letter-spacing="1">
      SYSTEM STATUS: OPTIMAL // ONLINE 24/7
    </text>
  </g>

  <!-- 右上角科技标签 -->
  <g transform="translate(680, 25)">
    <rect x="0" y="0" width="190" height="24" rx="12" fill="#1e1b4b" stroke="#7B2CBF" stroke-width="1" />
    <text x="95" y="16" fill="#c084fc" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle" letter-spacing="1">
      ⚡ DEV MATRIX V2.5
    </text>
  </g>

  <!-- 主标题区 (完整清晰大字) -->
  <g transform="translate(30, 95)">
    <!-- 装饰小标志 -->
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="url(#textGrad)" letter-spacing="1.5">
      SUDOJIA <tspan fill="#FF007F">//</tspan> DEV ⚡
    </text>

    <!-- 副标题/格言 -->
    <text x="2" y="36" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="16" fill="#cbd5e1" letter-spacing="0.5">
      一个小人物罢了 · 心怀热爱，代码不熄，步履不停 ✨
    </text>
  </g>

  <!-- 底部科技胶囊徽章列 -->
  <g transform="translate(30, 182)">
    <!-- 胶囊 1: 广州 -->
    <g transform="translate(0, 0)">
      <rect width="115" height="28" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#f59e0b" />
      <text x="26" y="18" fill="#e5e7eb" font-size="11" font-family="monospace" font-weight="600">Guangzhou 🇨🇳</text>
    </g>

    <!-- 胶囊 2: Java & Spring Boot -->
    <g transform="translate(125, 0)">
      <rect width="145" height="28" rx="6" fill="#111827" stroke="#10b981" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#10b981" />
      <text x="26" y="18" fill="#34d399" font-size="11" font-family="monospace" font-weight="600">Java &amp; Spring Boot</text>
    </g>

    <!-- 胶囊 3: CI/CD & Docker -->
    <g transform="translate(280, 0)">
      <rect width="150" height="28" rx="6" fill="#111827" stroke="#00BBF9" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#00BBF9" />
      <text x="26" y="18" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="600">Docker &amp; CI/CD</text>
    </g>

    <!-- 胶囊 4: AutoTaskScript 890+ Stars -->
    <g transform="translate(440, 0)">
      <rect width="170" height="28" rx="6" fill="#1e1b4b" stroke="#FF007F" stroke-width="1" />
      <text x="14" y="19" font-size="12">🌟</text>
      <text x="32" y="18" fill="#f43f5e" font-size="11" font-family="monospace" font-weight="bold">AutoTask 890+ ⭐</text>
    </g>
  </g>

  <!-- 右侧 菜狗吉祥物立体展示窗 -->
  <g transform="translate(740, 75)">
    <rect x="0" y="0" width="130" height="135" rx="14" fill="url(#badgeBg)" stroke="#10b981" stroke-width="2" />
    <circle cx="65" cy="50" r="34" fill="rgba(16, 185, 129, 0.15)" />
    <text x="65" y="44" font-size="36" text-anchor="middle">🥬</text>
    <text x="65" y="74" font-size="22" text-anchor="middle">🐶</text>
    <rect x="15" y="92" width="100" height="22" rx="5" fill="#047857" />
    <text x="65" y="107" fill="#ecfdf5" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle" letter-spacing="1">
      CA DOG // 菜狗
    </text>
    <text x="65" y="125" fill="#6ee7b7" font-size="8" font-family="monospace" text-anchor="middle">
      blog.imzjw.cn
    </text>
  </g>
</svg>
