name: Generate Snake Animation

on:
  # 每天午夜 0 点 (UTC) 自动定时刷新一次
  schedule:
    - cron: "0 0 * * *"
  # 支持手动在 Actions 页面点击触发
  workflow_dispatch:
  # 当主分支 push 更新时自动跑一次
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 使用官方 snk Action 抓取 sudojia 的最新绿格子并生成贪吃蛇动画
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: sudojia
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3b7dd8

      # 自动将生成的动画推送到 output 分支
      - name: Push snake svgs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
